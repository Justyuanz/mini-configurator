<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini product configurator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data.js" defer></script>
  <script src="logic.js" defer></script>
  <script src="app.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0400:600&display=swap"
    rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <span class="company"> Name here</span>
  </header>

  <main>
    <h1>Mini engine configurator</h1>
    <p class="intro">
      Pick a vessel, fuel, engines and add-ons. The price updates on every
      change.
    </p>

    <form id="form" novalidate>
      <div class="layout">
        <section class="options">
          <fieldset id="vesselOptions">
            <legend>1 · Vessel</legend>
            <label class="opt"><input type="radio" name="vessel" value="ferry" />Ferry · 1–4
              engines</label>
            <label class="opt"><input type="radio" name="vessel" value="cargo" checked />Cargo</label>
            <label class="opt"><input type="radio" name="vessel" value="cruise" />Cruise(Needs 2+ engines)</label>
          </fieldset>

          <fieldset id="fuelOptions">
            <legend>2 · Fuel</legend>
            <!--Filled by app.js-->
          </fieldset>

          <fieldset id="engineNumbers">
            <legend>3 · Engine</legend>
            <div class="engineField">
              <label for="engines">Engines: </label>
              <input type="number" id="engines" name="engines" value="1" min="1" max="4" />
              <p id="enginesError" class="error"></p>
            </div>
            <div class="engineField">
              <label for="cylinders">Cylinders: </label>
              <select name="cylinders" id="cylinders"></select>
            </div>
          </fieldset>

          <fieldset id="addonOptions">
            <legend>4 · Addon<span class="hint"> optional</span></legend>
            <!--Filled by app.js-->
          </fieldset>
        </section>

        <aside class="summary">
          <ul id="summary" role="status"></ul>
          <p id="price"></p>
          <button type="submit" id="previewButton">Request quote</button>
        </aside>
      </div>
    </form>

  </main>
</body>

</html>
